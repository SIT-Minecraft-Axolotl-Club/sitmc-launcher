release:
  title: "Release"
  create-title: "New release"
  edit-title: "Edit release :version"
  incomplete: "This release is not handed out completely because:"
  dynamic-title: "Self-update (Tauri dynamic updater)"
  dynamic-intro: "The dynamic updater built into the launcher requests the address below; the client replaces the placeholders with real values:"

instances:
  title: "Managed instances"
  intro: "The launcher reads its instance catalog from :path. Only published instances are handed to clients."
  empty: "No instance yet. Create one and upload its .mrpack pack."
  create: "New instance"
  publish: "Publication"
  published: "Published"
  disabled: "Disabled"
  confirm-delete: "Delete this instance and every pack it has? This cannot be undone."

instance:
  title: "Instance"
  create-title: "New instance"
  edit-title: "Edit instance :id"
  not-published: "This instance is not handed to clients because:"

field:
  id: "Instance id"
  id-hint: "Letters, digits, underscore and dash only, up to 64 characters. Clients use it to tell instances apart, and it cannot change later."
  name: "Name"
  description: "Description"
  icon_url: "Icon URL"
  icon_url-hint: "Must be https: the launcher only loads https images."
  game_version: "Game version"
  loader: "Loader"
  loader_version: "Loader version"
  server_address: "Server address"
  server_port: "Port"
  sort: "Sort"
  required: "Force deploy"
  required-hint: "Checked: clients download it automatically, keep it current, and players cannot delete it. Unchecked: nothing is downloaded until the player starts the instance, and players may delete it again (it stays listed for another download)."
  enabled: "Publish to clients"
  revision: "Revision"
  sha1: "SHA-1"
  sha1-hint: "40 lowercase hex characters. Clients verify the pack against it and refuse to install on a mismatch."
  size: "Size (bytes)"
  pack_url: "Pack URL"
  announcement_id: "Announcement id"
  announcement_id-hint: "1 to 100 characters, unique within the document. Letters, digits, underscore, dot and dash only so the admin screens can address it, and it cannot change later."
  title: "Title"
  content: "Content"
  content-hint: "Markdown, up to 20000 characters."
  summary: "Summary"
  summary-hint: "Up to 300 characters, may be empty. Shown in list and notification layouts."
  type: "Presentation"
  priority: "Priority"
  action_url: "Button link"
  action_url-hint: "Must be http(s) and must not carry a user name or password. Leave empty for no button."
  action_label: "Button label"
  action_label-hint: "Up to 80 characters. Clients use their own wording when it is empty."
  starts_at: "Starts at"
  ends_at: "Ends at"
  ends_at-hint: "Leave empty to never end; clients stop showing the announcement once it passes."
  published_at: "Published at"
  published_at-hint: "Clients sort announcements of the same priority by this time."
  channel: "Channel"
  channel-hint: "release reaches every player, beta only the test channel."
  version: "Version"
  version-hint: "Semantic version, e.g. 1.2.3 or 1.3.0-beta.1. Clients compare it numerically, component by component."
  pub_date: "Publication date"
  notes: "Release notes"
  notes-hint: "Markdown, up to 20000 characters. Shown in the client's update prompt."
  artifact_url: "Artifact URL"
  artifact_url-hint: "Direct link to the signed installer (*-setup.exe; a zip containing it works too): clients download it and run it silently. Leave empty to announce a version without offering a self-update."
  signature: "minisign signature"
  signature-hint: "Paste the whole matching .exe.sig file (a single base64 blob): clients only install an update whose signature verifies."
  target: "Target"
  arch: "Architecture"
  platform-hint: "Use windows / x86_64, matching the dynamic update path rather than windows-x86_64. Leave both empty to serve every platform; filled in, only matching target/arch requests are answered."
  platform: "Platform"

type:
  modal: "Modal"
  notification: "Notification"

priority:
  low: "Low"
  normal: "Normal"
  high: "High"
  critical: "Critical"

channel:
  release: "Release"
  beta: "Beta"

action:
  save: "Save"
  edit: "Edit"
  delete: "Delete"
  back: "Back to list"
  activate: "Roll back to this revision"

settings:
  title: "Launcher update policy"
  intro: "These three values are published with the catalog."
  min_version: "Minimum launcher version"
  min_version-hint: "Launchers older than this are blocked on a full screen that cannot be postponed. Leave empty for no minimum."
  latest_version: "Latest launcher version"
  latest_version-hint: "Only used to tell players a newer build exists. Leave empty to stay quiet."
  force_update: "Force update"
  force_update-hint: "Players cannot pause or postpone launcher updates."

packs:
  title: "Pack revisions"
  intro: "Every upload or registration becomes a new revision that is published immediately; clients reinstall because the revision changed."
  empty: "No pack yet, so this instance is not published. Upload a .mrpack or register an external URL."
  source: "Source"
  current: "current"
  external: "external URL"
  confirm-delete: "Delete this pack revision? Clients rolled back to it could no longer download it."
  upload: "Upload a .mrpack"
  upload-intro: "The SHA-1 is computed on upload and the file is published as a new revision."
  limits: "PHP limits: :upload per file, :post per POST. Use the external URL form below for packs larger than that."
  upload-button: "Upload and publish"
  external-title: "Register an external pack"
  external-intro: "Use this when the pack already lives elsewhere (object storage or a CDN): clients download that URL directly. The SHA-1 and size may be left empty, but clients then cannot verify integrity."
  external-sha1-hint: "Optional. 40 lowercase hex characters; when empty clients skip integrity verification. Providing it is strongly recommended."
  external-button: "Register and publish"
  too-large: "The pack exceeds the upload size PHP allows. Raise upload_max_filesize / post_max_size in php.ini, or use an external URL."
  error:
    upload-invalid: "The upload failed, please try again."
    upload-unreadable: "The uploaded file could not be read."
    upload-empty: "The uploaded file is empty."
    upload-not-zip: "That is not a usable pack: a .mrpack has to be a zip archive."
    upload-store-failed: "Storing the file failed. Check that storage/app is writable."

