  starts-at-invalid: "the start time cannot be parsed"
  ends-at-invalid: "the end time cannot be parsed"
  published-at-missing: "the publication time is missing"
  published-at-invalid: "the publication time cannot be parsed"
  action-url-scheme: "the button link is neither http nor https"
  action-url-host: "the button link has no host"
  action-url-userinfo: "the button link carries a user name or password"
  action-label-too-long: "the button label is longer than 80 characters"
  release-channel-invalid: "the channel is neither release nor beta"
  release-version-missing: "the version is missing"
  release-version-invalid: "the version is not a semantic version"
  pub-date-missing: "the publication date is missing"
  pub-date-invalid: "the publication date cannot be parsed"
  release-url-missing: "there is no artifact URL, so the dynamic updater gets no document"
  release-url-scheme: "the artifact URL is neither http nor https"
